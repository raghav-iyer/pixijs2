<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collision Editor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif; }
      #toolbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        background: #16213e; border-bottom: 1px solid #0f3460;
      }
      #toolbar button {
        padding: 6px 14px; border: 1px solid #0f3460; border-radius: 4px;
        background: #1a1a2e; color: #eee; cursor: pointer; font-size: 13px;
      }
      #toolbar button:hover { background: #0f3460; }
      #toolbar button.active { background: #e94560; border-color: #e94560; }
      #toolbar .separator { width: 1px; height: 24px; background: #0f3460; }
      #canvas-container { padding-top: 44px; width: 100%; height: 100%; }
      canvas { display: block; }
      #info-bar {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
        padding: 4px 12px; background: #16213e; border-top: 1px solid #0f3460;
        font-size: 12px; color: #aaa;
      }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="canvas-container"></div>
    <div id="info-bar">Boxes: 0</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
